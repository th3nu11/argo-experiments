apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-bonny
  labels:
    app: app-bonny
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-bonny
  template:
    metadata:
      labels:
        app: app-bonny
    spec:
      containers:
        - name: container-bonny
          image: "rg.fr-par.scw.cloud/bonny-registry/bonny-be:3dc1a7df9199ac622d2e6f3e1ca15cf4aac573e3"
          ports:
          - containerPort: 3000
          resources:
            requests:
              cpu: 100m
            limits:
              cpu: 200m
